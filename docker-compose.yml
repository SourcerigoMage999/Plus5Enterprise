services:
  object-storage:
    image: adobe/s3mock:5.1.0@sha256:65cf60155a2e235fe7d5bf6c633747d6fc7ed93f9f5a6727d86470026b83c2a2
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_REGION: us-east-1
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: plus5-material-quarantine,plus5-material-clean
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "127.0.0.1:4566:9090"
    volumes:
      - plus5-material-storage-data:/s3mockroot
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:9090/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  malware-scanner:
    image: clamav/clamav:1.4.3@sha256:d39ad368e587cc204f71675c3982adbc6717b8c4cb309a7ee9a3213f7e684c50
    volumes:
      - plus5-clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  database:
    image: mcr.microsoft.com/mssql/server:2025-latest@sha256:86cc6144ef39bb0fbed2329e1ad79b13ee82e7b2e4739213a0db0800e668a74a
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${PLUS5_SQL_SA_PASSWORD:?Set PLUS5_SQL_SA_PASSWORD in the local .env file}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - plus5-sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1" -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  database-init:
    image: mcr.microsoft.com/mssql/server:2025-latest@sha256:86cc6144ef39bb0fbed2329e1ad79b13ee82e7b2e4739213a0db0800e668a74a
    depends_on:
      database:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${PLUS5_SQL_SA_PASSWORD:?Set PLUS5_SQL_SA_PASSWORD in the local .env file}
      PLUS5_SQL_MIGRATION_PASSWORD: ${PLUS5_SQL_MIGRATION_PASSWORD:?Set PLUS5_SQL_MIGRATION_PASSWORD in the local .env file}
      PLUS5_SQL_APP_PASSWORD: ${PLUS5_SQL_APP_PASSWORD:?Set PLUS5_SQL_APP_PASSWORD in the local .env file}
    volumes:
      - ./docker/sqlserver/init.sql:/scripts/init.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/mssql-tools18/bin/sqlcmd
        -S database -U sa -P "$$MSSQL_SA_PASSWORD" -C -b
        -v MigrationPassword="$$PLUS5_SQL_MIGRATION_PASSWORD"
        ApplicationPassword="$$PLUS5_SQL_APP_PASSWORD"
        -i /scripts/init.sql
    restart: "no"

  migrations:
    build:
      context: .
      dockerfile: backend/src/Plus5.Infrastructure/Dockerfile.migrations
    depends_on:
      database-init:
        condition: service_completed_successfully
    environment:
      PLUS5_MIGRATION_CONNECTION_STRING: >-
        Server=database,1433;Database=Plus5;User ID=plus5_migrator;
        Password=${PLUS5_SQL_MIGRATION_PASSWORD:?Set PLUS5_SQL_MIGRATION_PASSWORD in the local .env file};
        Encrypt=True;TrustServerCertificate=True;Connect Timeout=5
      PLUS5_MIGRATION_ALLOW_UNTRUSTED_CERTIFICATE: "true"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/src/Plus5.Api/Dockerfile
    depends_on:
      migrations:
        condition: service_completed_successfully
      object-storage:
        condition: service_healthy
      malware-scanner:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      AllowedHosts: localhost;127.0.0.1;api
      ConnectionStrings__Plus5: >-
        Server=database,1433;Database=Plus5;User ID=plus5_app;
        Password=${PLUS5_SQL_APP_PASSWORD:?Set PLUS5_SQL_APP_PASSWORD in the local .env file};
        Encrypt=True;TrustServerCertificate=True;Connect Timeout=5
      Frontend__PublicOrigin: http://localhost:8081
      Email__Host: host.docker.internal
      Email__Port: 1025
      Email__UseSsl: "false"
      Email__FromAddress: no-reply@plus5.local
      MaterialStorage__ServiceUrl: http://object-storage:9090
      MaterialStorage__Region: us-east-1
      MaterialStorage__AccessKeyId: test
      MaterialStorage__SecretAccessKey: test
      MaterialStorage__QuarantineBucket: plus5-material-quarantine
      MaterialStorage__CleanBucket: plus5-material-clean
      MaterialStorage__ProviderCode: S3
      MaterialStorage__ForcePathStyle: "true"
      MalwareScanner__Host: malware-scanner
      MalwareScanner__Port: 3310
      MalwareScanner__TimeoutSeconds: 120
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8081:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  plus5-sql-data:
  plus5-material-storage-data:
  plus5-clamav-data:
